version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
      
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    open-pull-requests-limit: 99999
    ignore:
      - dependency-name: "@types/node"
    groups:
      global-deps:
        exclude-patterns:
          - "@biomejs/biome"
        update-types:
          - "patch"
          - "minor"